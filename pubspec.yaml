name: tidarium
description: "Tidarium (时匣) — a unified schedule assistant with a sandboxed plugin ecosystem."
publish_to: 'none'
version: 0.4.0+120

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  html: ^0.15.7
  image_picker: ^1.2.4
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  timezone: ^0.11.2
  webview_flutter: ^4.14.1
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/wakeup_schools.json
